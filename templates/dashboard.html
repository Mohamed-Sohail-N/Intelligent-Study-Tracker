<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 10px;
            color: white;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            flex: 1;
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .card h2 {
            margin: 10px 0;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .chart-box {
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        canvas {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }

        @media(max-width: 768px){
            .charts {
                grid-template-columns: 1fr;
            }
            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <a href="/" class="back-btn">⬅ Back</a>
        <h1>📊 Dashboard</h1>
        <div></div>
    </div>

    <!-- Cards -->
    <div class="cards">
        <div class="card">
            <h3>✅ Completed</h3>
            <h2>{{ completed }}</h2>
        </div>

        <div class="card">
            <h3>⏳ Pending</h3>
            <h2>{{ pending }}</h2>
        </div>

        <div class="card">
            <h3>📌 Total</h3>
            <h2>{{ completed + pending }}</h2>
        </div>
    </div>

    <!-- Charts -->
    <div class="charts">

        <div class="chart-box">
            <h3>Task Status</h3>
            <canvas id="pieChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Tasks per Day</h3>
            <canvas id="barChart"></canvas>
        </div>

    </div>

</div>

<script>
    // Pie Chart
    new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: {
            labels: ['Completed', 'Pending'],
            datasets: [{
                data: [{{ completed }}, {{ pending }}],
                backgroundColor: ['#00ffcc', '#ff4d6d']
            }]
        }
    });

    // Bar Chart
    new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
            labels: {{ dates | tojson }},
            datasets: [{
                label: 'Tasks',
                data: {{ counts | tojson }},
                backgroundColor: '#00c6ff'
            }]
        }
    });
</script>

</body>
</html>
