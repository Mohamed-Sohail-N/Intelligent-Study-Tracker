<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
}

/* animated background glow */
body::before{
    content:'';
    position:absolute;
    width:600px;
    height:600px;
    background: radial-gradient(circle,#00f2fe,transparent);
    top:-100px;
    left:-100px;
    filter:blur(120px);
    animation:move 8s infinite alternate;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background: radial-gradient(circle,#ff00cc,transparent);
    bottom:-100px;
    right:-100px;
    filter:blur(120px);
    animation:move 10s infinite alternate;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(80px,80px);}
}

.container{
    width:360px;
    padding:40px;
    border-radius:20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    text-align:center;
    color:white;
    position:relative;
    z-index:1;
}

h2{
    margin-bottom:25px;
    font-weight:600;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background: rgba(255,255,255,0.1);
    color:white;
}

.input-box label{
    position:absolute;
    left:10px;
    top:12px;
    color:#ccc;
    transition:0.3s;
    pointer-events:none;
}

.input-box input:focus + label,
.input-box input:valid + label{
    top:-8px;
    left:8px;
    font-size:12px;
    color:#00f2fe;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background: linear-gradient(90deg,#00f2fe,#4facfe);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00f2fe;
}

.extra{
    margin-top:15px;
    font-size:14px;
}

.extra a{
    color:#00f2fe;
    text-decoration:none;
}

.extra a:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="container">
    <h2>🔐 Welcome Back</h2>

    <form method="POST">

        <div class="input-box">
            <input type="text" name="username" required>
            <label>Username</label>
        </div>

        <div class="input-box">
            <input type="password" name="password" required>
            <label>Password</label>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="extra">
        Don’t have an account? <a href="/signup">Sign up</a>
    </div>
</div>

</body>
</html>
